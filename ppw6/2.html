<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Responsive Navbar</title>

<style>
nav ul {
  display: flex;
  gap: 20px;
  list-style: none;
  padding: 0;
}

@media (max-width: 768px) {
  nav ul {
    flex-direction: column;
  }
}
</style>

</head>
<body>

<nav>
  <ul>
    <li><a href="#">Home</a></li>
    <li><a href="#">About</a></li>
    <li><a href="#">Contact</a></li>
  </ul>
</nav>

</body>
</html>
