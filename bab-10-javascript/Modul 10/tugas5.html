<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kalkulator Pink</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
    font-family:'Segoe UI',sans-serif;
    background:linear-gradient(135deg,#ffe4ec,#ffd6e8);
    min-height:100vh;
    display:flex;align-items:center;justify-content:center;
}
.kalkulator{
    background:#fff0f6;
    border-radius:24px;
    padding:28px;
    width:340px;
    box-shadow:0 10px 30px rgba(0,0,0,0.1);
}
.judul{text-align:center;color:#d63384;font-size:.8rem;margin-bottom:16px}
.layar{
    background:#fff;
    border-radius:14px;
    padding:16px;
    margin-bottom:20px;
    text-align:right;
}
#ekspresi{color:#aaa;font-size:.8rem}
#tampilan{color:#d63384;font-size:2rem}
.grid{display:grid;gap:10px}
.grid-4{grid-template-columns:repeat(4,1fr)}
.grid-2{grid-template-columns:repeat(2,1fr);margin-top:10px}
.tombol{
    border:none;border-radius:12px;
    padding:16px;cursor:pointer;font-weight:bold
}
.t-angka{background:#ffc2d1}
.t-op{background:#ff8fab;color:#fff}
.t-fungsi{background:#ffd6e8}
.t-sama{background:#ff6f91;color:#fff}
.t-ac{background:#ffb3c6}
.t-hapus{background:#ff8fab;color:#fff}
.t-nol{grid-column:span 2}
.riwayat-panel{
    background:#fff;border-radius:10px;
    padding:10px;margin-top:12px;font-size:.8rem
}
</style>
</head>
<body>
<div class="kalkulator">
<div class="judul">💗 Kalkulator</div>
<div class="layar">
<div id="ekspresi"></div>
<div id="tampilan">0</div>
</div>

<div class="grid grid-4">
<button class="tombol t-ac" onclick="resetAll()">AC</button>
<button class="tombol t-fungsi" onclick="toggleNegatif()">+/-</button>
<button class="tombol t-fungsi" onclick="persen()">%</button>
<button class="tombol t-op" onclick="inputOperator('/')">÷</button>

<button class="tombol t-angka" onclick="inputAngka('7')">7</button>
<button class="tombol t-angka" onclick="inputAngka('8')">8</button>
<button class="tombol t-angka" onclick="inputAngka('9')">9</button>
<button class="tombol t-op" onclick="inputOperator('*')">×</button>

<button class="tombol t-angka" onclick="inputAngka('4')">4</button>
<button class="tombol t-angka" onclick="inputAngka('5')">5</button>
<button class="tombol t-angka" onclick="inputAngka('6')">6</button>
<button class="tombol t-op" onclick="inputOperator('-')">−</button>

<button class="tombol t-angka" onclick="inputAngka('1')">1</button>
<button class="tombol t-angka" onclick="inputAngka('2')">2</button>
<button class="tombol t-angka" onclick="inputAngka('3')">3</button>
<button class="tombol t-op" onclick="inputOperator('+')">+</button>

<button class="tombol t-angka t-nol" onclick="inputAngka('0')">0</button>
<button class="tombol t-angka" onclick="inputDesimal()">.</button>
<button class="tombol t-sama" onclick="hitung()">=</button>
</div>

<div class="grid grid-2">
<button class="tombol t-fungsi" onclick="fungsi('sqrt')">√</button>
<button class="tombol t-fungsi" onclick="fungsi('pow')">x²</button>
<button class="tombol t-hapus" onclick="hapus()">DEL</button>
<button class="tombol t-fungsi" onclick="fungsi('abs')">|x|</button>
</div>
</div>

<script>
let now="0",prev="",op="";
function update(){
document.getElementById("tampilan").innerText=now;
document.getElementById("ekspresi").innerText=prev&&op?prev+" "+op:"";
}

function inputAngka(n){now=now==="0"?n:now+n;update()}
function inputOperator(o){prev=now;op=o;now="0";update()}
function inputDesimal(){if(!now.includes("."))now+=".";update()}
function resetAll(){now="0";prev="";op="";update()}
function hapus(){now=now.slice(0,-1)||"0";update()}
function toggleNegatif(){now=String(-parseFloat(now));update()}
function persen(){now=String(parseFloat(now)/100);update()}

function hitung(){
let a=parseFloat(prev),b=parseFloat(now),h=0;
if(op==="+")h=a+b;
else if(op==="-")h=a-b;
else if(op==="*")h=a*b;
else if(op==="/")h=b===0?"Error":a/b;
now=String(h);prev="";op="";update();
}

function fungsi(f){
let x=parseFloat(now);
if(f==="sqrt")now=x<0?"Error":Math.sqrt(x);
if(f==="pow")now=x*x;
if(f==="abs")now=Math.abs(x);
now=String(now);update();
}
</script>

</body>
</html>
