<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verifikasi Praktikan</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
    body {
        background: linear-gradient(135deg, #ffd6e8, #ffc2d1);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: 'Segoe UI', sans-serif;
    }

    .card-custom {
        background: #fff0f6;
        border-radius: 20px;
        padding: 30px;
        width: 100%;
        max-width: 500px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        text-align: center;
    }

    h2 {
        color: #d63384;
        margin-bottom: 20px;
    }

    .btn-pink {
        background-color: #ff6fa5;
        border: none;
        color: white;
        padding: 10px 25px;
        border-radius: 10px;
        font-weight: bold;
    }

    .btn-pink:hover {
        background-color: #e85d96;
    }

    #hasil {
        margin-top: 20px;
    }
</style>
</head>

<body>
<div class="card-custom">
    <h2>Verifikasi Praktikan PPW1</h2>
    <button class="btn-pink" onclick="cek()">Verifikasi</button>

    <div id="hasil"></div>
</div>

<script>
function cek() {
    let tanya = confirm("Apakah Anda praktikan PPW1?");

    let hasil = document.getElementById("hasil");

    if (tanya) {
        let nama = prompt("Masukkan Nama:");
        let nim = prompt("Masukkan NIM:");
        let angkatan = prompt("Masukkan Angkatan:");

        hasil.innerHTML = `
        <table class="table table-bordered mt-3">
            <tr><th>Nama</th><td>${nama}</td></tr>
            <tr><th>NIM</th><td>${nim}</td></tr>
            <tr><th>Angkatan</th><td>${angkatan}</td></tr>
        </table>
        `;
    } else {
        hasil.innerHTML = `
        <div class="alert alert-danger mt-3">
            Anda bukan praktikan PPW1, anda tidak boleh masuk!
        </div>
        `;
    }
}
</script>

</body>
</html>
