<!DOCTYPE html>
<html>
<head>
    <title>Form Kuesioner Mahasiswa</title>
</head>

<body style="background-color:#f1f3f4; font-family:Arial;">

<center>

<!-- Gambar di atas form -->
<img src="https://i.pinimg.com/1200x/ff/38/ab/ff38ab41af707b42dd95da80266aab15.jpg" width="600">

<br><br>

<form style="background-color:white; width:600px; padding:20px; text-align:left;">

    <h2>Form Kuesioner Mahasiswa</h2>
    <p>Silakan isi data berikut dengan benar.</p>

    <!-- Gambar di dalam form -->
    <img src="https://i.pinimg.com/1200x/38/8d/67/388d673a733b68ecb3204c05cf1ed87b.jpg" width="560">
    <br><br>

    <fieldset>
        <legend><b>Data Pribadi</b></legend>

        Nama Lengkap:<br>
        <input type="text" name="nama" size="50"><br><br>

        Email:<br>
        <input type="email" name="email" size="50"><br><br>

        Password:<br>
        <input type="password" name="password" size="50"><br><br>
    </fieldset>

    <br>

    <fieldset>
        <legend><b>Jenis Kelamin</b></legend>

        <input type="radio" name="jk" value="Laki-laki"> Laki-laki<br>
        <input type="radio" name="jk" value="Perempuan"> Perempuan
    </fieldset>

    <br>

    <fieldset>
        <legend><b>Pilih Program Studi</b></legend>

        <select name="prodi">
            <option>Sistem Informasi</option>
            <option>Teknologi Rekayasa Perangkat lunak</option>
            <option>Ilmu Komputer</option>
        </select>
    </fieldset>

    <br>

    <fieldset>
        <legend><b>Minat Mata Kuliah</b></legend>

        <input type="checkbox" name="minat" value="Pemrograman"> Pemrograman<br>
        <input type="checkbox" name="minat" value="Basis Data"> Basis Data<br>
        <input type="checkbox" name="minat" value="Jaringan"> Jaringan
    </fieldset>

    <br>

    <fieldset>
        <legend><b>Saran dan Masukan</b></legend>

        <textarea rows="4" cols="50"></textarea>
    </fieldset>

    <br>

    <input type="submit" value="Kirim">
    <input type="reset" value="Reset">

</form>

</center>

</body>
</html>
