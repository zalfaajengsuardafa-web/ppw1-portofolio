<!DOCTYPE html>
<html>
<head>
<title>Form Pendaftaran</title>
</head>

<body>

<h2>Form Pendaftaran Mahasiswa Baru</h2>

<form>

Nama Lengkap:<br>
<input type="text" size="50" required><br><br>

Email:<br>
<input type="email" size="50" required><br><br>

Password:<br>
<input type="password" size="50" required><br><br>

Jenis Kelamin:<br>
<input type="radio" name="jk"> Laki-laki
<input type="radio" name="jk"> Perempuan
<br><br>

Program Studi:<br>
<select>
<option>Informatika</option>
<option>Sistem Informasi</option>
<option>Teknik Komputer</option>
</select>
<br><br>

Hobi:<br>
<input type="checkbox"> Coding<br>
<input type="checkbox"> Desain<br>
<input type="checkbox"> Membaca<br><br>

Alamat:<br>
<textarea rows="4" cols="50"></textarea><br><br>

<input type="submit" value="Daftar">
<input type="reset" value="Reset">

</form>

</body>
</html>
