<!DOCTYPE html>
<html>
<head>
<title>Form Pendaftaran Mahasiswa Baru</title>
</head>

<body style="background-color:#f1f3f4; font-family:Arial;">

<center>

<!-- Gambar di atas form -->
<img src="bg.png" width="600">

<br><br>

<form style="background:white; width:600px; padding:20px; 
text-align:left; border-radius:10px;">

<h2>Form Pendaftaran Mahasiswa Baru</h2>

<!-- Gambar di dalam form -->
<img src="bg.png" width="560">
<br><br>

Nama Lengkap:<br>
<input type="text" size="60" required><br><br>

Email:<br>
<input type="email" size="60" required><br><br>

Password:<br>
<input type="password" size="60" required><br><br>

Jenis Kelamin:<br>
<input type="radio" name="jk"> Laki-laki
<input type="radio" name="jk"> Perempuan
<br><br>

Program Studi:<br>
<select>
<option>Informatika</option>
<option>Sistem Informasi</option>
<option>Teknik Komputer</option>
</select>
<br><br>

Hobi:<br>
<input type="checkbox"> Coding<br>
<input type="checkbox"> Desain<br>
<input type="checkbox"> Membaca<br><br>

Alamat:<br>
<textarea rows="4" cols="60"></textarea><br><br>

<input type="submit" value="Daftar">
<input type="reset" value="Reset">

</form>

</center>

</body>
</html>
